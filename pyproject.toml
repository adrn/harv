[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "harv"
dynamic = ["version"]
description = "Tools for modeling Keplerian systems in astrometric and/or radial velocity data."
authors = [
    { name = "adrn", email = "583379+adrn@users.noreply.github.com" },
]
license = "MIT"
requires-python = ">= 3.12"
readme = {"file" = "README.md", "content-type" = "text/markdown"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
# TODO: add keywords
keywords = []
dependencies = [
    "equinox>=0.13.2",
    "h5py>=3.15.1",
    "jax==0.8.1",
    "jaxoplanet>=0.1.0",
    "jaxtyping>=0.3.3",
    "numpyro>=0.15.0",
    "numpyro-ext>=0.0.4",
    "quaxed>=0.10.4",
    "unxt>=1.7.2",
]

[project.optional-dependencies]
extra = [
    "gaiaunlimited @ git+https://github.com/gaia-unlimited/gaiaunlimited.git",
    "setuptools",  # needed for gaiaunlimited for pkg_resources...
    "arviz>=1.0.0",
    "matplotlib>=3.10.7",
    "tinygp>=0.3.1",
    "healpy>=1.18.1",
    "pooch>=1.8.2",
]

[tool.uv]
override-dependencies = [
    # "unxt @ file:///Users/aprice-whelan/projects/unxt",
    # "unxt @ git+https://github.com/adrn/unxt.git@quantity-stub",
    "unxt @ git+https://github.com/adrn/unxt.git@a78e1965f5033c31e8ab519848b3ff0a01e9e9ab",
    "numpyro-ext @ git+https://github.com/adrn/numpyro-ext.git"
]

[dependency-groups]
extra = [
    "gaiaunlimited @ git+https://github.com/gaia-unlimited/gaiaunlimited.git",
    "setuptools",  # needed for gaiaunlimited for pkg_resources...
    "arviz>=1.0.0",
    "matplotlib>=3.10.7",
    "tinygp>=0.3.1",
    "healpy>=1.18.1",
    "pooch>=1.8.2",
]
dev = [
    {include-group = "extra"},
    {include-group = "test"},
    {include-group = "docs"},
    "hatch",
    "ipykernel",
    "ipywidgets",
    "pre-commit",
    "twine",
    "ruff",
    "ty>=0.0.22",
    "jedi==0.19.1",
]
docs = [
    "sphinx~=8.0",
    "myst-parser>=4.0",
    "pydata-sphinx-theme~=0.16",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autoapi>=3.6.0",
    "sphinx_design>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "corner>=2.2.3",
    "ipykernel>=7.1.0",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-raises",
    # "pytest-randomly",
    "pytest-xdist",
    "beartype",
    "matplotlib>=3.10.7",
    "sybil>=10.0.1",
]

[project.urls]
Homepage = "https://github.com/adrn/harv"
"Source Code" = "https://github.com/adrn/harv"
"Bug Tracker" = "https://github.com/adrn/harv/issues"
Documentation = "https://harv.readthedocs.io"
Download = "https://pypi.org/project/harv/#files"

################################################################################
# Tool Configuration
################################################################################

# Hatch is building your package's wheel and sdist
# This tells hatch to only include Python packages (i.e., folders with __init__.py) in the build.
# read more about package building, here:
# https://www.pyopensci.org/python-package-guide/package-structure-code/python-package-distribution-files-sdist-wheel.html
[tool.hatch.build]
only-packages = true

# This tells Hatch to build the package from the src/ directory.
# Read more about src layouts here: https://www.pyopensci.org/python-package-guide/package-structure-code/python-package-structure.html
[tool.hatch.build.targets.wheel]
packages = ["src/harv"]


[tool.hatch.build.hooks.vcs]
version-file = "src/harv/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

######## Configure pytest for your test suite ########
[tool.pytest.ini_options]
testpaths = ["README.md", "tests", "src"]
markers = ["raises"] # Tells pytest to not raise a warning if you use @pytest.mark.raises

[tool.coverage.paths]
source = [
    "src/harv",
    "*/site-packages/harv",
]

[tool.coverage.run]
# Ensures code coverage is measured for branches (conditional statements with different outcomes) in your code.
branch = true
parallel = true
omit = [
    "src/harv/_version.py",
]

[tool.coverage.report]
# This configures the output test coverage report
exclude_lines = ["pragma: no cover"]
precision = 2

