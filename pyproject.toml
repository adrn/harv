[tool.ruff]
line-length = 88
target-version = "py312"

    [tool.ruff.lint]
    select = ["ALL"]
    ignore = [
        "D107",  # 'Missing docstring in __init__' ignored because pydoclint wants us to document the class instead.
        "D203",  # '1 blank line required before class docstring' ignored because we want no blank line.
        "D212",  # 'Multi-line docstring summary should start at the first line' ignored because we want the summary to start on the second line.
        "D407",  # 'Missing dashed underline after section' ignored because Google style docstrings don't underline.
        "D413",  # 'Missing blank line after section' ignored .
        "D401",  # 'First line should be in imperative mood' ignored
        "ANN001",  # Missing type annotation for {arg} in function" ignored
        "ANN201",  # 'Missing type annotation for {return}'.
        "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
        "ARG001",  # Unused function argument  # TODO: resolve
        "B008",    # Do not perform function calls in argument defaults
        "COM812",  # <- for ruff.format
        "D103",    # Missing docstring in public function  # TODO: resolve
        "D105",    # Missing docstring in magic method
        "D203",    # 1 blank line required before class docstring
        "D213",    # Multi-line docstring summary should start at the second line
        "ERA001",  # Commented out code
        "F722",    # Syntax error in forward annotation  <- jaxtyping
        "F811",    # redefinition of unused '...'  <- plum-dispatch
        # "F821",    # undefined name '...'  <- jaxtyping
        "FIX002",  # Line contains TODO
        "ISC001",  # Conflicts with formatter
        "PD",      # Pandas
        "PLR09",   # Too many <...>
        "PLR2004", # Magic value used in comparison
        "PYI041",  # Use `complex` instead of `int | complex` <- plum is more strict
        "RUF022",  # `__all__` is not sorted
        "SLF001",  # private-member-access TODO: unignore this.
        "TD002",   # Missing author in TODO
        "TD003",   # Missing issue link on the line following this TODO
        "N806",    # Variable names must be lowercase
        "EM101",   # Assign string to variable for exception
        "EM102",   # Something about f-strings in exceptions
        "TRY003",  # ??
        "INP001",
        "N803",    # Argument name should be lowercase
        "FBT001",  # Some boolean function thing
        "FBT002",  # Some boolean function thing
        "UP037",   # Remove quote from type annotation  <- jaxtyping
        "N802",    # Function name should be lowercase
        "N815",    # Variable name {name} should be lowercase
        "N816",    # should not be mixedCase
        "N817",    # CamelCase
    ]
    exclude = [
        "src/harv/_version.py",
        "docs/conf.py",
    ]

    [tool.ruff.lint.extend-per-file-ignores]
    "__init__.py" = [
        "E401",  # 'Multiple imports on one line'
        "E402",  # 'Module level import not at top of file'
        "F401",  # 'Imported but unused'
        "I001",  # 'Import block is un-sorted or un-formatted' ignored because we may have to import in a particular, not-alphabetical order.
    ]
    "tests/**/*.py" = [
        "ARG002", # Unused argument
        "ANN202", # Missing type annotation"
        "D",  # documentation not important for tests
        "S101",  # Use of assert detected' ignored because we are using pytest.
        "INP001",  # Insecure input ignored because we are testing.
        "ANN201",  # Missing type annotation for {return} ignored because all tests return `None`.
        "ANN204",
    ]
    "src/harv/samplers/*.py" = [
        "S101",  # 'Use of assert detected' — used for type narrowing of invariants from extract_data
    ]
    "src/harv/likelihood/*.py" = [
        "RUF001",  # ambiguous unicode
        "RUF002",  # ambiguous unicode
        "RUF003",  # ambiguous unicode
    ]
    "docs/**/*" = [
        "E402",  # module-import-not-at-top-of-file
        "T201",  # print
        "FBT003",  # boolean-positional-value-in-call
        "A004",  # astropy.io.ascii - shadows built-in ascii
    ]
    "docs/_static/*" = ["ALL"]

    [tool.ruff.lint.isort]
    case-sensitive = true
    known-first-party = ["src", "harv"]

[tool.ty.rules]

    [[tool.ty.overrides]]
    # NOTE: this is needed because of a bug or issue in the way ty and jaxtyping
    # interact. ty treats parametric string, e.g., Q["angle"] as a forward reference
    # (PEP 484 semantics), then fails to resolve angle as a Python name. The string is
    # actually a runtime dimension descriptor consumed by unxt/jaxtyping — not a forward
    # annotation.
    include = ["src/harv/custom_types.py"]
    rules = { unresolved-reference = "ignore" }

    [[tool.ty.overrides]]
    include = ["src/harv/plot.py"]
    rules = { possibly-missing-attribute = "ignore" }

    [[tool.ty.overrides]]
    include = ["src/harv/kepler/constants.py"]
    rules = { unresolved-import = "ignore" }


[tool.pydoclint]
style = "numpy"
arg-type-hints-in-signature = false
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false
exclude = ["_version.py", "scripts/*"]

# Use UV to create Hatch environments
[tool.hatch.envs.default]
installer = "uv"
