# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"
  jobs:
    build:
      html:
        - uv run --group docs nox -s docs -- --output-dir "$READTHEDOCS_OUTPUT"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
        - nox
