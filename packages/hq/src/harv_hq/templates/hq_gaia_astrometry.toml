# hq run configuration. Every key is documented in harv-hq's spec,
# "Configuration (hq.toml)". Relative paths resolve against this directory.

[run]
name = "my-gaia-run"
kind = "gaia_astrometry"
seed = 42
model_file = "prior.py"

[data]
# One row per Gaia along-scan observation, readable by astropy.table.Table.read.
file = "epoch_astrometry.fits"
source_id = "source_id"
time = "time"                 # barycentric times
time_format = "jd"            # astropy Time format
time_scale = "tcb"            # astropy Time scale; converted to TCB
al_position = "al_position"
al_position_err = "al_position_err"
scan_angle = "scan_angle"
parallax_factor = "parallax_factor"
al_position_unit = "mas"      # used only if the column carries no unit
scan_angle_unit = "deg"       # used only if the column carries no unit

[prepare]
min_n_obs = 10

# Optional: one row per source, joined onto the results for the viewer.
# [catalog]
# file = "catalog.fits"
# source_id = "source_id"
# columns = ["bp_rp", "abs_g", "parallax"]

[prior_cache]
n_samples = 10_000_000

[rejection]
top_k = 512

# Optional: MCMC follow-up of sources the rejection sampler under-resolves.
# [mcmc]
# select = "under_resolved"
