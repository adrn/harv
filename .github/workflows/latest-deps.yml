name: Latest deps

# Every job in the CI workflow installs from uv.lock, so on its own CI never sees
# what `pip install harv` resolves today. This workflow re-resolves every
# dependency to the newest version pyproject.toml allows (the rewritten lock stays
# in the runner). It is report-only: it is a separate workflow so that an upstream
# release cannot block unrelated PRs or turn the CI badge red, while a failure
# still fails this workflow's run (and the weekly cron emails). One gap:
# [tool.uv] override-dependencies still pins unxt to the git fork, so unxt here is
# not what pip users get; jax and numpyro are.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types:
      - published
  # harv tracks fast-moving upstreams (jax, unxt, numpyro, jaxoplanet). The weekly
  # run is how we find out a new release of one of them broke us, rather than
  # discovering it on the next PR.
  schedule:
    - cron: "0 23 * * Sun"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same skip flags as the CI workflow: the "skip tests" label or a "[skip tests]"
  # head commit subject skips this on a PR.
  check_skip_flags:
    name: Check skip flags
    runs-on: ubuntu-latest
    outputs:
      head-commit-message:
        ${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a pull_request event github.sha is the *merge* commit, whose
          # subject is "Merge <sha> into <sha>" - we want the branch head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Get head commit message
        id: get_head_commit_message
        run: echo "HEAD_COMMIT_MESSAGE=$(git show -s --format=%s)" >> "$GITHUB_OUTPUT"

  latest-deps:
    name: Latest deps (unlocked)
    runs-on: ubuntu-latest
    needs: [check_skip_flags]
    if: >-
      github.event_name != 'pull_request' ||
      (!contains(github.event.pull_request.labels.*.name, 'skip tests') &&
      !contains(needs.check_skip_flags.outputs.head-commit-message, '[skip tests]'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: latest

      # On a fresh runner uv lists every package it installs (`+ jax==...`), so
      # the log records which versions a failure ran against.
      - name: Install the project at the newest allowed versions
        run: uv sync --no-default-groups --group test --upgrade

      - name: Run test suite
        run: uv run --no-sync pytest -n auto --dist loadfile --durations=20 --color=yes
