name: Run Tests
# Run the test suite on pull requests and pushes to main branch
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23 * * Sun'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # , windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.5.2

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Run test suite
      run: uv run --group test pytest -x -q --cov=harv --cov-report=xml --durations=20

    # If you use this step and have a private repo- then you will need to get a
    # token from codecov and
    # save it as a github secret called CODECOV_TOKEN
    - name: Upload to codecov
      if: runner.os == 'macOS' && matrix.python-version == '3.13'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        files: ./coverage.xml
