name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # Release tags too: a tag can point at a commit that never sat on main, and
    # waiting for the GitHub release to be published would test it only after
    # it was cut. branches and tags are ORed within one push trigger.
    tags:
      - "v*"
  release:
    types:
      - published
  # harv tracks fast-moving upstreams (jax, unxt, numpyro, jaxoplanet). The weekly
  # run is how we find out a new release of one of them broke us, rather than
  # discovering it on the next PR.
  schedule:
    - cron: "0 23 * * Sun"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests and docs can each be skipped on a PR, either with a label or with a
  # flag in the head commit subject. Both are PR-only by design: pushes to main,
  # scheduled runs, and published releases always run everything.
  check_skip_flags:
    name: Check skip flags
    runs-on: ubuntu-latest
    outputs:
      head-commit-message:
        ${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a pull_request event github.sha is the *merge* commit, whose
          # subject is "Merge <sha> into <sha>" - we want the branch head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Get head commit message
        id: get_head_commit_message
        run: echo "HEAD_COMMIT_MESSAGE=$(git show -s --format=%s)" >> "$GITHUB_OUTPUT"

  # Always runs: it is the lint/format/type gate, and it is cheap. This is the
  # single source of truth for ruff and ty -- they are invoked through
  # .pre-commit-config.yaml at pinned revs, not separately here.
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The local `ty` hook shells out to `uv run ty check src`, so the project
      # environment has to exist. Syncing here rather than letting the hook do it
      # implicitly means pre-commit itself comes from the pinned dev group.
      - name: Install the project
        run: uv sync

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit, check_skip_flags]
    # Skip with the "skip tests" label or a "[skip tests]" commit subject.
    if: >-
      github.event_name != 'pull_request' ||
      (!contains(github.event.pull_request.labels.*.name, 'skip tests') &&
      !contains(needs.check_skip_flags.outputs.head-commit-message, '[skip tests]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            runs-on: ubuntu-latest
            coverage: true
          - python-version: "3.13"
            runs-on: ubuntu-latest
          - python-version: "3.14"
            runs-on: ubuntu-latest
          - python-version: "3.14"
            runs-on: macos-latest
          - python-version: "3.14"
            runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --no-default-groups skips the "dev" group, which would otherwise pull in
      # the docs toolchain, nox, and the git checkout of gaiaunlimited;
      # --no-sync below stops `uv run` from adding it back.
      - name: Install the project
        run: uv sync --no-default-groups --group test

      - name: Run test suite
        run: >-
          uv run --no-sync pytest --cov --cov-report=xml --cov-report=term
          --durations=20 --color=yes

      - name: Upload coverage report
        if: matrix.coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          files: ./coverage.xml

  # Notebooks are *not* executed here -- that is the separate, label-gated
  # Tutorials workflow. This only checks that the docs build, which is otherwise
  # only discovered on Read the Docs after merge.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    # Deliberately does not need pre-commit, so docs feedback arrives in
    # parallel. Skip with the "skip docs" label or a "[skip docs]" commit
    # subject.
    needs: [check_skip_flags]
    if: >-
      github.event_name != 'pull_request' ||
      (!contains(github.event.pull_request.labels.*.name, 'skip docs') &&
      !contains(needs.check_skip_flags.outputs.head-commit-message, '[skip docs]'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --no-default-groups --group docs --group nox

      # Through nox, not bare sphinx-build: docs/api/ is generated by the
      # noxfile's build_api_docs session (sphinx-apidoc) and is gitignored, so a
      # direct sphinx-build would fail on a missing toctree. This is also exactly
      # what .readthedocs.yaml runs.
      - name: Build docs
        run: uv run --no-sync nox -s docs

  status:
    name: CI Pass
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [pre-commit, checks, docs]
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
