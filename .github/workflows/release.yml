name: Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

# Actions are pinned to commit SHAs, with the tag in a comment, so a moved tag
# cannot change what runs here. Dependabot keeps them current.
jobs:
  # Split from publish for security: the job that holds the PyPI credentials
  # runs no build code.
  # https://github.com/pypa/gh-action-pypi-publish/issues/217#issuecomment-1965727093
  dist:
    name: Distribution build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # hatch-vcs derives the version from tags, and needs history for the
          # commit distance, so shallow clones are not enough. fetch-tags alone
          # gives the tags but not the history they are measured against.
          fetch-depth: 0

      # Builds the sdist, builds the wheel *from* that sdist, runs
      # `twine check --strict`, lists the contents, and uploads a "Packages"
      # artifact. Building the wheel from the sdist is what catches a sdist that
      # is missing files.
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

  publish:
    needs: [dist]
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Never attempt to publish from a fork, and only from a published release.
    if: >-
      github.repository_owner == 'adrn' && github.event_name == 'release' &&
      github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/harv
    permissions:
      id-token: write # mandatory for trusted publishing
      attestations: write
      contents: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Packages
          path: dist

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Publishes via Trusted Publishing: the project must exist on PyPI with a
      # publisher configured for this repo, this workflow file, and the pypi
      # environment.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
